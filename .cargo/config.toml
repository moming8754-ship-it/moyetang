# 东方摩耶堂 · cargo 配置（**M17 / 2.0.0 新增**）
#
# # 为什么要有这个文件
#
# 这个项目的目录名是中文（`D:\东方摩耶堂`）。安卓构建在**链接**这一步会用到 NDK 的
# `aarch64-linux-android24-clang.cmd` —— 那是个 **cmd 包装脚本**，参数会被按系统 ANSI
# 代码页（中文机器上是 **936/GBK**）转一道；而 `ld.lld` 按 **UTF-8** 解路径，于是：
#
#     ld.lld: error: cannot open D:\\\xb6\xab\xb7\xbd\xc4\xa6\xd2\xae\xcc\xc3\\notes-app\\...
#                        ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ 这是「东方摩耶堂」的 GBK 字节
#
# → 路径里有中文时，安卓链接**必崩**（跟代码没关系）。
#
# # 怎么修的
#
# 绕开那个 `.cmd`，**直接调 `clang.exe`**：Windows 给 .exe 传的是 UTF-16 命令行，
# 中间没有代码页转换，中文路径就原样传下去了。用 `linker` 指定 clang.exe，
# 再用 `rustflags` 把 `.cmd` 里本来会加的 `--target=<abi><api>` 补上
# （API 取 **24**，与 `app/build.gradle.kts` 的 `minSdk = 24` 一致）。
#
# ⚠️ 换机器/换 NDK 版本时，改下面这四行路径即可（NDK 版本号在路径里）。
# ⚠️ 只影响安卓目标的**链接**，电脑版（Windows/MSVC）一个字都没改。

[target.aarch64-linux-android]
linker = "D:\\Android\\Sdk\\ndk\\26.1.10909125\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\clang.exe"
rustflags = ["-Clink-arg=--target=aarch64-linux-android24"]

[target.armv7-linux-androideabi]
linker = "D:\\Android\\Sdk\\ndk\\26.1.10909125\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\clang.exe"
rustflags = ["-Clink-arg=--target=armv7a-linux-androideabi24"]

[target.i686-linux-android]
linker = "D:\\Android\\Sdk\\ndk\\26.1.10909125\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\clang.exe"
rustflags = ["-Clink-arg=--target=i686-linux-android24"]

[target.x86_64-linux-android]
linker = "D:\\Android\\Sdk\\ndk\\26.1.10909125\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\clang.exe"
rustflags = ["-Clink-arg=--target=x86_64-linux-android24"]
