# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Our old plugin template had a bug that caused missing `consumer-rules.pro` files
# so we have to disable it for now.
# See https://github.com/tauri-apps/tauri/pull/15828#issuecomment-5199937796
android.proguard.failOnMissingFiles=false

# Keeping Gradle 9 compatible with current plugins
# TODO: Remove this in v3
android.builtInKotlin=false
android.newDsl=false

# ── M17（2.0.0）：本项目路径带中文（D:\东方摩耶堂），AGP 默认会直接报错 ──
#     > Your project path contains non-ASCII characters. This will most likely cause the
#     > build to fail on Windows.
#     AGP 这个检查的**真正原因是 Windows 上链路的编码问题**；我们已经用
#     `CARGO_TARGET_DIR=D:\moyetang_target`（见 `.spike\m17-android-build.ps1`）把链接器
#     会碰到的那批文件全部挪到了纯英文路径上，所以这里放行是**有依据的**，不是硬糊。
#     （Java/Gradle 自己处理 Unicode 路径没问题；真正不能忍的是 ld.lld 那个 ANSI 取值。）
android.overridePathCheck=true

# M17 (2.0.0): HTTP timeouts -- a hung repository connection must fail loudly
# instead of blocking the build for minutes with no output (measured: 6 min silent).
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
